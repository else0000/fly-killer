name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token, plus the two scopes a Pages deployment requires.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. In-flight production deploys are allowed to finish
# rather than being cancelled by a newer push.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # `npm run build` runs tsc --noEmit before bundling, so a type error
      # fails the job instead of shipping.
      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # Deliberately pinned to v4. upload-pages-artifact@v5 moved to the
      # immutable-artifacts API, which has been observed uploading an
      # artifact that the deploy step then "successfully" publishes empty.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
